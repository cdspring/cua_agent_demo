# Capability manifest for `cua-driver` in `bounded` mode.
#
# Why bounded: the default `standard` mode allows input to ANY application with
# no prompt. That is acceptable while wiring things up and wrong for an agent
# that runs unattended on a machine holding a logged-in browser.
#
# A manifest is deny by default: a tool must be in `allow.tools` AND every
# resource it touches must match. It narrows a mode and never widens one.
#
# Windows notes, each learned from a failed or wrong run:
#   - Apps are identified by an absolute `executable`. `bundle_id` is macOS.
#   - `expires_after` and `idle_timeout` are both REQUIRED in bounded. Supplying
#     only the manifest fails startup rather than falling back to standard.
#   - `desktop.display: true` is REQUIRED for a usable manifest on Windows.
#     Measured, not assumed: with `display: false` the runtime refuses
#     list_windows, list_apps, get_accessibility_tree, click and type_text with
#     "desktop display observation is outside the capability manifest". The agent
#     cannot learn a pid or a window_id, so it cannot address anything and the
#     manifest deadlocks. `display` is therefore "may the agent see the desktop
#     at all", not merely "may it capture a full screenshot".
#     The boundary that actually constrains the agent is `resources.apps` below,
#     not this flag. Verified: with display true, unlisted apps are still refused
#     with bounded_resource_outside_manifest.
#   - Do NOT add `resources.browser.origins` to this file. The runtime refuses to
#     start when a manifest scopes browser origins while generic tools such as
#     click and get_window_state remain available, because those tools see
#     whatever tab is open. Run browser work and desktop work as two runtimes.
#
# Verify before unattended use. scripts/verify-bounded.mjs does all three:
#   1. an in-scope call succeeds silently
#   2. the same tool against an unlisted app returns
#      bounded_resource_outside_manifest
#   3. a tool that is not listed at all returns permission_denied

version: 3
expires_after: 8h
idle_timeout: 30m

allow:
  tools:
    # session lifecycle
    - start_session
    - end_session
    # discovery
    - list_windows
    - list_apps
    - get_screen_size
    # observation. get_window_state is the primary entry point and MUST be
    # listed: omitting it denies every per-window observation with
    # "tool 'get_window_state' is outside the capability manifest", which looks
    # exactly like an app-scope refusal and is how an earlier revision of this
    # file produced three confident but wrong conclusions.
    - get_window_state
    - get_accessibility_tree
    - zoom
    # input
    - click
    - double_click
    - right_click
    - type_text
    - set_value
    - press_key
    - hotkey
    - scroll
    - drag
    - move_cursor
    # window geometry
    - set_window_frame
    - bring_to_front
    # postconditions
    - verify_state
    # lifecycle
    - launch_app
    - kill_app

  # Deliberately absent, and why:
  #   get_desktop_state  whole-display capture; per-window state is enough
  #   browser_*          needs its own runtime, see the header
  #   clipboard_*        reads and writes the user's clipboard
  #   start_recording    writes trajectory captures to disk
  #   parse_visual_regions, install_extension, replay_trajectory
  #   history_*, check_for_update, update
  # Adding any of these is a scope decision, not a convenience.

resources:
  apps:
    # Absolute, verified to exist on this machine.
    - executable: C:\Windows\System32\notepad.exe
      launch: true
      windows: all
      # Only ever terminates a process this runtime started. Never "always".
      terminate: driver_launched

    - executable: C:\Windows\System32\calc.exe
      launch: true
      windows: all
      terminate: driver_launched

    - executable: C:\Windows\System32\charmap.exe
      launch: true
      windows: all
      terminate: driver_launched

  files:
    read:
      - dir: C:\Users\spring\Documents
        recursive: false
    write:
      # Never grant a broad write root. Keep outputs in one reviewable place.
      - dir: C:\Users\spring\AppData\Local\Temp\opencode\cu-output
        recursive: true

  desktop:
    # See the header: false deadlocks discovery on Windows. The real boundary
    # is resources.apps.
    display: true
